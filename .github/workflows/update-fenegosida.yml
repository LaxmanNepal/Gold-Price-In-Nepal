name: Update FENEGOSIDA Rates

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch FENEGOSIDA official rates
        env:
          API_URL: https://api.fenegosida.org/api/website/v1/Dashboard/today
        run: |
          node <<'NODE'
          const fs = require('fs');
          const https = require('https');

          const api = process.env.API_URL;
          const file = 'data/fenegosida.json';

          function getJson(url) {
            return new Promise((resolve, reject) => {
              const req = https.get(url, {
                headers: {
                  'User-Agent': 'LaxmanNepal-GoldPrice/1.0',
                  'Accept': 'application/json',
                  'Origin': 'https://www.fenegosida.org',
                  'Referer': 'https://www.fenegosida.org/'
                }
              }, res => {
                let body = '';
                res.on('data', c => body += c);
                res.on('end', () => {
                  if (res.statusCode < 200 || res.statusCode >= 300) return reject(new Error('HTTP ' + res.statusCode));
                  try { resolve(JSON.parse(body)); } catch (e) { reject(e); }
                });
              });
              req.setTimeout(20000, () => { req.destroy(new Error('timeout')); });
              req.on('error', reject);
            });
          }

          (async () => {
            const rows = await getJson(api);
            if (!Array.isArray(rows)) throw new Error('Unexpected FENEGOSIDA response');

            const find = (...labels) => rows.find(x => labels.every(label => String(x.rateType || '').includes(label)));
            const gold = find('छापावाल सुन', '१ तोला');
            const gold10 = find('छापावाल सुन', '१० ग्राम');
            const tejabi = find('तेजाबी सुन', '१ तोला');
            const silver = find('असली चाँदी', '१ तोला');
            const silver10 = find('असली चाँदी', '१० ग्राम');
            if (!gold || !silver) throw new Error('Required FENEGOSIDA rows missing');

            const existing = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : {history:[]};
            const rateDate = String(gold.todayDate || new Date().toISOString()).split('T')[0];
            const entry = {
              date: rateDate,
              gold: Number(gold.todayBaseRatePerGram),
              silver: Number(silver.todayBaseRatePerGram)
            };
            const history = Array.isArray(existing.history) ? existing.history.filter(x => x.date !== rateDate) : [];
            history.unshift(entry);
            history.sort((a,b) => String(b.date).localeCompare(String(a.date)));

            const output = {
              goldTola: entry.gold,
              gold10g: Number(gold10?.todayBaseRatePerGram || Math.round(entry.gold / 1.16638)),
              tejabiTola: Number(tejabi?.todayBaseRatePerGram || Math.round(entry.gold * 0.9167)),
              silverTola: entry.silver,
              silver10g: Number(silver10?.todayBaseRatePerGram || Math.round(entry.silver / 1.16638)),
              goldYesterday: Number(gold.yestardayBaseRatePerGram || 0),
              silverYesterday: Number(silver.yestardayBaseRatePerGram || 0),
              rateDate,
              publishedAt: gold.todayDate || null,
              fetchedAt: new Date().toISOString(),
              status: 'verified',
              source: 'FENEGOSIDA',
              sourceUrl: 'https://api.fenegosida.org/api/website/v1/Dashboard/today',
              history: history.slice(0,365)
            };

            fs.mkdirSync('data', {recursive:true});
            fs.writeFileSync(file, JSON.stringify(output, null, 2) + '\\n');
            console.log(JSON.stringify(output, null, 2));
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Commit changed rate data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fenegosida.json
          git diff --cached --quiet || git commit -m "chore: update FENEGOSIDA gold and silver rates"
          git push
